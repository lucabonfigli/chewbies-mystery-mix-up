<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Franken Chewbie's Flavor Mash</title>
<link rel="stylesheet" href="game.css?v=c7da6d72">
<style>html,body{height:100%;margin:0;overflow:hidden;background:#2a0b4e}body{position:relative}</style>
</head>
<body>

<!-- #mm-game is the game's box. Here it is the whole viewport; in the Shopify
     section it is the framed area. The markup inside is what the section
     carries too — build_theme.py copies it from this file. -->
<div id="mm-game">
<div id="app">

  <!-- 1 · TITLE -->
  <section class="screen on" id="s-title" data-bg="title">
    <button class="ovBtn" id="btn-play" data-ov="title-btn" aria-label="Enter if you dare"></button>
  </section>

  <!-- 2 · GAME -->
  <section class="screen" id="s-game" data-bg="game">
    <div class="bgLive" id="bgLive" aria-hidden="true"></div>
    <div class="panel" id="panel"></div>
    <div class="leverArm"  id="leverArm"  aria-hidden="true"></div>
    <div class="leverDome" id="leverDome" aria-hidden="true"></div>
    <p class="srOnly" id="leverState" role="status" aria-live="polite"></p>
    <button class="spriteBtn" id="s2-submit" data-spr="s2-submit" aria-label="Submit your guess" disabled></button>
    <button class="spriteBtn" id="s2-back"   data-spr="s2-back"   aria-label="Back"></button>
  </section>

  <!-- 3 · FORM -->
  <section class="screen" id="s-form" data-bg="form">
    <form id="entryForm" novalidate>
      <input id="f-first" name="firstName" placeholder="First Name"    autocomplete="given-name">
      <input id="f-last"  name="lastName"  placeholder="Last Name"     autocomplete="family-name">
      <input id="f-email" name="email"     placeholder="Email Address" type="email"
             autocomplete="email" inputmode="email">
      <input id="f-fav"   name="favourite" placeholder="Favorite Flavor" list="flavourList">
      <datalist id="flavourList"></datalist>
      <p class="err" id="formErr" role="alert"></p>
      <button class="spriteBtn" id="f-submit" data-spr="s3-submit" type="submit" aria-label="Submit"></button>
      <button class="spriteBtn" id="f-back"   data-spr="s3-back"   type="button" aria-label="Back"></button>
    </form>
    <p class="legal" id="formLegal"></p>
  </section>

  <!-- 4 · DONE -->
  <section class="screen" id="s-done" data-bg="done">
    <a class="ovBtn" id="lnk-ig" data-ov="ig" target="_blank" rel="noopener" aria-label="Instagram"></a>
    <a class="ovBtn" id="lnk-tt" data-ov="tiktok" target="_blank" rel="noopener" aria-label="TikTok"></a>
  </section>

  <!-- lightning: a white flash over everything when the title button is hit -->
  <div class="flash" id="flash" aria-hidden="true"></div>
</div>
<!-- outside #app: the canvas overflows the frame in cover mode, so anything
     pinned to its corner gets clipped. Pinned to the frame instead. -->
<button class="mute" id="mute" aria-label="Mute sound">&#9835;</button>
</div>

<script src="game.js?v=c7da6d72"></script>
</body>
</html>
