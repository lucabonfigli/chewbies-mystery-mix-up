<!doctype html>
<meta charset="utf-8">
<title>Flavor Mash — Shopify framing preview</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  /* Verbatim from sections/mystery-game.liquid on the live Hi-Chew theme:
     gap 5rem · padding 8rem 0 15rem · width 90% · max-width 1100px
     height 900px, 866px at 1152px and up · iframe border 7px #FFF, radius 20px */
  *{box-sizing:border-box}
  body{margin:0;background:#740494}
  .mm-wrap{
    align-items:center;display:flex;flex-direction:column;
    gap:5rem;padding:8rem 0 15rem;
    background:#740494 url(preview-bg.webp) center/cover no-repeat;
    min-height:100vh;
  }
  .mm-frame{
    position:relative;width:90%;max-width:1100px;height:900px;overflow:hidden;
  }
  @media (min-width:1152px){ .mm-frame{height:866px} }
  .mm-frame iframe{
    position:absolute;top:0;left:0;width:100%;height:100%;
    border:7px solid #FFF;border-radius:20px;
  }
  .readout{
    position:fixed;right:12px;bottom:12px;background:rgba(0,0,0,.72);color:#fff;
    font:12px/1.4 ui-monospace,monospace;padding:7px 10px;border-radius:6px;
  }
</style>

<div class="mm-wrap">
  <div class="mm-frame">
    <iframe id="f" title="Franken Chewbie's Flavor Mash" allow="autoplay"></iframe>
  </div>
</div>

<div class="readout" id="ro"></div>

<script>
  const f = document.getElementById("f"), ro = document.getElementById("ro");
  f.src = "index.html?cb=" + Date.now();
  function measure(){
    const b = document.querySelector(".mm-frame").getBoundingClientRect();
    ro.textContent = `frame ${Math.round(b.width)}×${Math.round(b.height)}  ratio ${(b.width/b.height).toFixed(3)}`;
  }
  addEventListener("resize", measure); measure();
</script>
