<title>Chewbie's Mystery Mix-Up</title>
<style>
:root{
  --purple:#5b1f9e; --purple-2:#7b2fbe; --ink:#2a0b4e;
  --display:"Arial Rounded MT Bold","Helvetica Rounded",Nunito,Quicksand,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:#3d1470;
  font-family:var(--display);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
#app{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden}

/* ---------- screens ---------- */
.screen{
  position:absolute;inset:0;display:none;
  align-items:center;justify-content:center;
  opacity:0;transition:opacity .35s ease;
}
.screen.on{display:flex;opacity:1}
.screen.plate{
  background-repeat:no-repeat;background-position:center;background-size:contain;
  cursor:pointer;
}
#s-title{background-image:var(--title-d)}
#s-rules{background-image:var(--rules-d)}
#s-done {background-image:var(--done-d)}
@media (max-aspect-ratio:1/1){
  #s-title{background-image:var(--title-m)}
  #s-rules{background-image:var(--rules-m)}
  #s-done {background-image:var(--done-m)}
}

/* invisible hotspot sitting on the baked button in each plate */
.hotspot{
  position:absolute;border:0;background:transparent;cursor:pointer;
  border-radius:999px;
}
.hotspot:focus-visible{outline:3px solid #fff;outline-offset:4px}
.hotspot::after{
  content:"";position:absolute;inset:-6%;border-radius:999px;
  box-shadow:0 0 0 0 rgba(255,214,102,.85);
  animation:pulse 1.9s ease-out infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(255,214,102,.55)}
  70%{box-shadow:0 0 0 22px rgba(255,214,102,0)}
  100%{box-shadow:0 0 0 0 rgba(255,214,102,0)}
}

/* ---------- game stage ---------- */
/* The game always fills the iframe, so vw/vh are exactly the frame. Sizing the
   stage from min() keeps the comp's 4:3 proportions in a frame of ANY shape —
   `height:100%` with `aspect-ratio` silently stretches instead of letterboxing. */
.stage{
  position:relative;display:flex;
  width:min(100vw, calc(100vh * 4 / 3));
  height:min(100vh, calc(100vw * 3 / 4));
}
/* DOM order is shelf-then-scene (the mobile stack); landscape flips it back
   to the comp's scene-left / shelf-right composition */
.sceneWrap{flex:0 0 51.979%;position:relative;order:1}
.shelfWrap{flex:0 0 48.021%;position:relative;order:2}
.pane{position:relative;width:100%;height:100%}
.pane>img{position:absolute;inset:0;width:100%;height:100%;display:block}
.pane>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

@media (max-aspect-ratio:1/1){
  .stage{flex-direction:column;width:100%;height:100%}
  .shelfWrap{order:1;flex:0 0 34%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
             box-shadow:inset 0 -14px 18px -10px rgba(0,0,0,.65)}
  .sceneWrap{order:2}
  .shelfWrap .pane{height:auto}
  .shelfWrap .pane>img{position:static;height:auto}
  .shelfWrap .pane>svg{position:absolute;top:0;left:0;height:100%}
  .sceneWrap{flex:1 1 auto;min-height:0;display:flex;justify-content:center}
  .sceneWrap .pane{width:auto;aspect-ratio:998/1440}
  .scrollHint{display:block}
}
.scrollHint{
  display:none;position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
  font-size:11px;letter-spacing:.12em;color:#fff;opacity:.8;pointer-events:none;
  text-shadow:0 2px 4px rgba(0,0,0,.8);z-index:3;
}

/* bottle buttons live in the SVG; these are the a11y proxies */
.bottleHit{cursor:pointer;fill:transparent}
.bottleHit:focus{outline:none}
.bottleHit:focus-visible + .focusRing{opacity:1}
.focusRing{opacity:0;fill:none;stroke:#fff;stroke-width:6;stroke-dasharray:10 8}

/* ---------- form ---------- */
/* drops over the potion shelf, as on slide 8 */
.formPanel{
  position:absolute;top:0;right:0;width:48.021%;height:100%;z-index:5;
  container-type:inline-size;
  background:linear-gradient(150deg,#7b2ec7 0%,#5f1fa8 55%,#b45bd8 100%);
  display:flex;flex-direction:column;justify-content:center;
  padding:5% 7%;overflow-y:auto;
  transform:translateY(-101%);transition:transform .5s cubic-bezier(.3,1.2,.4,1);
}
.formPanel.open{transform:translateY(0)}
.formTitle{
  font-size:clamp(22px,4.4cqw,52px);color:#ffd23f;text-align:center;margin:0 0 .35em;
  -webkit-text-stroke:.06em #e2560b;paint-order:stroke;letter-spacing:.02em;
}
.formSub{font-size:clamp(12px,2cqw,24px);color:#fff;text-align:center;margin:0 0 1.1em;line-height:1.35}
.fields{border:3px solid #ffd23f;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.06)}
.fields input, .fields select{
  width:100%;border:0;border-bottom:3px solid #ffd23f;background:transparent;
  color:#fff;font-family:inherit;font-size:clamp(12px,1.9cqw,22px);
  padding:.85em 1em;outline:none;letter-spacing:.04em;
}
.fields select{appearance:none;cursor:pointer}
.fields select option{color:#2a0b4e}
.fields > *:last-child input,.fields > *:last-child select{border-bottom:0}
.fields input::placeholder{color:rgba(255,255,255,.62);text-transform:uppercase}
.fields input:focus,.fields select:focus{background:rgba(255,255,255,.12)}
.consent{display:flex;gap:.6em;align-items:flex-start;margin-top:1em;color:#fff;
  font-size:clamp(10px,1.4cqw,16px);line-height:1.4;cursor:pointer}
.consent input{margin-top:.2em;width:1.15em;height:1.15em;accent-color:#ffd23f;flex:none}
.consent a{color:#ffd23f}
.err{color:#ffe08a;font-size:clamp(10px,1.4cqw,16px);min-height:1.4em;margin:.5em 0 0;text-align:center}
.btnPill{
  display:block;margin:1.1em auto 0;border:0;cursor:pointer;font-family:inherit;
  color:#fff;font-size:clamp(15px,2.6cqw,30px);letter-spacing:.03em;
  padding:.5em 1.9em;border-radius:999px;
  background:radial-gradient(ellipse at 50% 30%,#ffd76a 0%,#ffa415 55%,#f07d05 100%);
  box-shadow:0 0 26px rgba(255,180,40,.75),inset 0 -6px 12px rgba(180,80,0,.35);
  -webkit-text-stroke:.045em #e2560b;paint-order:stroke;
}
.btnPill:hover{filter:brightness(1.08)}
.btnPill:active{transform:translateY(2px)}
.btnGhost{background:none;border:2px solid rgba(255,255,255,.6);box-shadow:none;-webkit-text-stroke:0;
  font-size:clamp(12px,1.8cqw,20px);padding:.45em 1.4em;margin-top:.7em}

/* portrait: the form takes the whole stage, as on the mobile comp */
@media (max-aspect-ratio:1/1){
  .formPanel{width:100%;left:0;right:auto}
  .formTitle{font-size:clamp(26px,9cqw,46px)}
  .formSub{font-size:clamp(14px,4.2cqw,22px)}
  .fields input,.fields select{font-size:clamp(14px,4cqw,20px)}
  .consent,.err{font-size:clamp(11px,3.1cqw,15px)}
  .btnPill{font-size:clamp(17px,5.4cqw,26px)}
  .btnGhost{font-size:clamp(13px,3.8cqw,18px)}
}

/* ---------- confirmation extras ---------- */
.doneCard{
  position:absolute;left:50%;transform:translateX(-50%);bottom:4%;
  display:flex;flex-direction:column;align-items:center;gap:.7em;z-index:2;
}
.mixChips{display:flex;align-items:center;gap:.5em}
.mixChips img{width:clamp(34px,6vmin,62px);height:auto;filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
.mixChips span{color:#fff;font-size:clamp(16px,3vmin,30px);-webkit-text-stroke:.05em #6b2fae;paint-order:stroke}

/* ---------- chrome ---------- */
.mute{
  position:absolute;right:10px;top:10px;z-index:20;width:38px;height:38px;border-radius:999px;
  border:2px solid rgba(255,255,255,.45);background:rgba(0,0,0,.35);color:#fff;
  cursor:pointer;font-size:17px;line-height:1;display:grid;place-items:center;
}
.stamp{
  position:absolute;left:10px;bottom:8px;z-index:20;color:#fff;opacity:.4;
  font-size:10px;letter-spacing:.22em;text-transform:uppercase;pointer-events:none;
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important;transition-duration:.001s !important}
}
</style>

<div id="app">
  <div class="screen plate on" id="s-title">
    <button class="hotspot" id="btn-play" aria-label="Let's play"></button>
  </div>

  <div class="screen plate" id="s-rules">
    <button class="hotspot" id="btn-start" aria-label="Happy mixing — start the game"></button>
  </div>

  <div class="screen" id="s-game">
    <div class="stage">
      <div class="shelfWrap">
        <div class="pane">
          <img id="img-shelf" alt="Shelf of flavour potions">
          <svg id="svg-shelf" viewBox="0 0 922 1440" aria-hidden="false"></svg>
        </div>
        <div class="scrollHint">SCROLL FOR MORE POTIONS</div>
      </div>
      <div class="sceneWrap">
        <div class="pane">
          <img id="img-scene" alt="Chewbie at the cauldron">
          <svg id="svg-scene" viewBox="0 0 998 1440"></svg>
        </div>
      </div>
      <div class="formPanel" id="formPanel"></div>
    </div>
  </div>

  <div class="screen plate" id="s-done">
    <div class="doneCard">
      <div class="mixChips" id="doneChips"></div>
      <button class="btnPill btnGhost" id="btn-again">MIX ANOTHER</button>
    </div>
  </div>

  <button class="mute" id="mute" aria-label="Mute sound">&#9835;</button>
  <div class="stamp">Prototype</div>
</div>

<script>
const ASSETS = __ASSETS__;

/* =====================================================================
   FLAVOUR CONFIG  —  the only thing Multiply needs to edit.
   `name` values are my best read of the icons in the deck; the deck does
   not label them. `color` is sampled straight from the artwork.
   `mixWith` lets you hand-tune any pair whose computed blend looks wrong,
   e.g.  8: { mixWith: { 10: "#c9d94a" } }
   ===================================================================== */
const FLAVOURS = [
  { name:"Green Apple"    }, { name:"Strawberry"    }, { name:"Pineapple"     }, { name:"Candy Apple" },
  { name:"Orange"         }, { name:"Cherry"        }, { name:"Blue Raspberry"}, { name:"Key Lime Pie" },
  { name:"Grape"          }, { name:"Peach"         }, { name:"Lemon"         }, { name:"Lemon Lime"  },
  { name:"Mango"          }, { name:"Kiwi"          }, { name:"Watermelon"    }, { name:"Ube Ice Cream" },
  { name:"Banana"         }, { name:"Blueberry"     }, { name:"Pink Grapefruit"},{ name:"Piña Colada" }
];
const DISCS = __DISCS__;             // geometry + colour lifted from the comp
DISCS.forEach((d,i)=>{ FLAVOURS[i].color = d.color; FLAVOURS[i].geo = d; });

const SEAM = 998;                    // x where the comp was split into scene | shelf

/* =====================================================================
   INTEGRATION SURFACE
   This game makes NO network requests of any kind. It never stores,
   transmits or persists anything. Everything it knows leaves through
   postMessage to the parent frame, and the host decides what to do
   with it. That boundary is deliberate — see docs/INTEGRATION.md.
   ===================================================================== */
const VERSION = "1.0.0";
const QS = new URLSearchParams(location.search);
const CFG = Object.assign({
  // ?bg=740494 — the host section passes its own background through so any
  // letterbox around the stage is invisible against the page
  pageColor    : "#" + (QS.get("bg") || "740494").replace(/^#/,""),
  targetOrigin : "*",     // tighten to the storefront origin in production
  waitForHost  : false,   // true = hold the confirmation until the host acks
  recaptcha    : false,   // true = ask the host for a v3 token before submitting
  recaptchaMs  : 8000,    // give up waiting for the token after this
  flavours     : null     // [{name, mixWith}] by index, overrides the defaults
}, window.MYSTERY_MIX_CONFIG || {});

if (Array.isArray(CFG.flavours))
  CFG.flavours.forEach((o,i)=>{ if(FLAVOURS[i]) Object.assign(FLAVOURS[i], o); });

function emit(type, data){
  const msg = Object.assign({ source:"mystery-mix", version:VERSION, type }, data||{});
  try{ if(window.parent !== window) window.parent.postMessage(msg, CFG.targetOrigin); }catch(e){}
  window.dispatchEvent(new CustomEvent("mysterymix:"+type, { detail:msg }));
  return msg;
}
function emitSize(){
  emit("resize", { height: Math.ceil(document.documentElement.scrollHeight) });
}

/* ---------------- colour: OKLab blend so mixes stay vivid --------------- */
const srgb2lin = c => c<=0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4);
const lin2srgb = c => c<=0.0031308 ? c*12.92 : 1.055*Math.pow(c,1/2.4)-0.055;
function hex2oklab(hex){
  const r=srgb2lin(parseInt(hex.slice(1,3),16)/255),
        g=srgb2lin(parseInt(hex.slice(3,5),16)/255),
        b=srgb2lin(parseInt(hex.slice(5,7),16)/255);
  const l=Math.cbrt(0.4122214708*r+0.5363325363*g+0.0514459929*b),
        m=Math.cbrt(0.2119034982*r+0.6806995451*g+0.1073969566*b),
        s=Math.cbrt(0.0883024619*r+0.2817188376*g+0.6299787005*b);
  return [0.2104542553*l+0.7936177850*m-0.0040720468*s,
          1.9779984951*l-2.4285922050*m+0.4505937099*s,
          0.0259040371*l+0.7827717662*m-0.8086757660*s];
}
function oklab2hex([L,a,b]){
  const l=(L+0.3963377774*a+0.2158037573*b)**3,
        m=(L-0.1055613458*a-0.0638541728*b)**3,
        s=(L-0.0894841775*a-1.2914855480*b)**3;
  const to = v => Math.max(0,Math.min(255,Math.round(lin2srgb(v)*255)));
  return "#"+[to( 4.0767416621*l-3.3077115913*m+0.2309699292*s),
              to(-1.2684380046*l+2.6097574011*m-0.3413193965*s),
              to(-0.0041960863*l-0.7034186147*m+1.7076147010*s)]
             .map(v=>v.toString(16).padStart(2,"0")).join("");
}
/* Mixing happens on the RYB (paint) wheel, not the RGB one.
   This matters: averaging Blue Raspberry and Lemon in RGB or OKLab gives
   grey mud, because they sit opposite each other. On the RYB wheel they
   give green — which is both what everyone expects from mixing blue and
   yellow, and what the comp on slide 7 actually shows. */
const RYB=[[0,0],[60,120],[120,180],[180,210],[240,240],[300,300],[360,360]];
function pw(x,pts,inv){
  const P = inv ? pts.map(p=>[p[1],p[0]]) : pts;
  for(let k=0;k<P.length-1;k++){
    const [a,A]=P[k],[b,B]=P[k+1];
    if(x>=a&&x<=b) return A+(B-A)*(b===a?0:(x-a)/(b-a));
  }
  return x;
}
function rgb2hsl(hex){
  const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,l=(mx+mn)/2;
  let h=0,s=0;
  if(d){
    s=l>.5?d/(2-mx-mn):d/(mx+mn);
    h = mx===r ? ((g-b)/d+(g<b?6:0)) : mx===g ? (b-r)/d+2 : (r-g)/d+4;
    h*=60;
  }
  return [h,s,l];
}
function hsl2hex(h,s,l){
  h=((h%360)+360)%360;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
  const t=[[c,x,0],[x,c,0],[0,c,x],[0,x,c],[x,0,c],[c,0,x]][Math.floor(h/60)%6];
  return "#"+t.map(v=>Math.round((v+m)*255).toString(16).padStart(2,"0")).join("");
}
function mixFlavours(i,j){
  const ov = FLAVOURS[i].mixWith?.[j] || FLAVOURS[j].mixWith?.[i];
  if (ov) return ov;
  const [hA,sA,lA]=rgb2hsl(FLAVOURS[i].color), [hB,sB,lB]=rgb2hsl(FLAVOURS[j].color);
  const a=pw(hA,RYB), b=pw(hB,RYB);
  const d=((b-a+540)%360)-180;                 // shortest way round the wheel
  const h=pw(((a+d/2)%360+360)%360, RYB, true);
  // the further apart two paints are, the muddier the result — near
  // complementary pairs lose chroma instead of snapping to a random vivid hue
  const comp=Math.abs(d)/180, mud=comp*comp;
  const s=Math.min(1,Math.max(.55,Math.max(sA,sB)*.97*(1-.45*mud)));
  const l=Math.min(.60,Math.max(.40,(lA+lB)/2-.06*mud));
  return hsl2hex(h,s,l);
}
function shade(hex,k){                       // k<1 darker, k>1 lighter
  const o=hex2oklab(hex); return oklab2hex([Math.max(0,Math.min(1,o[0]*k)),o[1],o[2]]);
}

/* ------------------------------ audio ---------------------------------- */
let actx=null, muted=false;
function ac(){ return actx ||= new (window.AudioContext||window.webkitAudioContext)(); }
function tone(freq,dur,type="sine",vol=.18,slide=0){
  if(muted) return;
  const c=ac(), o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,c.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),c.currentTime+dur);
  g.gain.setValueAtTime(0,c.currentTime);
  g.gain.linearRampToValueAtTime(vol,c.currentTime+.012);
  g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);
  o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+dur+.02);
}
const sfxPick   = i => { tone(520+i*22,.16,"triangle",.16,260); tone(1180+i*30,.10,"sine",.07,300); };
const sfxDrop   = () => tone(300,.18,"sine",.14,-140);
const sfxBubble = () => { for(let k=0;k<7;k++) setTimeout(()=>tone(180+Math.random()*260,.14,"sine",.10,120), k*95); };
const sfxWin    = () => [523,659,784,1047].forEach((f,k)=>setTimeout(()=>tone(f,.34,"triangle",.15),k*105));

/* ------------------------------ state ---------------------------------- */
const state = { picks:[], mixed:false };
const $ = s => document.querySelector(s);

/* ------------------------------ shelf ---------------------------------- */
function buildShelf(){
  const svg=$("#svg-shelf");
  svg.innerHTML = `<defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>` + FLAVOURS.map((f,i)=>{
    const x=f.geo.cx-SEAM, y=f.geo.cy;
    return `<g class="bottle" data-i="${i}" transform="translate(${x} ${y})">
      <g class="lift" transform="scale(1)">
        <circle class="halo" r="98" fill="${f.color}" opacity="0" filter="url(#glow)"/>
        <image class="sprite" href="${ASSETS['b'+String(i).padStart(2,'0')]}"
               x="-100" y="-150" width="200" height="240" opacity="0"/>
        <circle class="ring" r="78" fill="none" stroke="${f.color}" stroke-width="0"
                filter="url(#glow)" opacity="0"/>
      </g>
      <circle class="bottleHit" r="86" tabindex="0" role="button"
              aria-pressed="false" aria-label="${f.name}"/>
      <circle class="focusRing" r="92"/>
    </g>`;
  }).join("");

  svg.querySelectorAll(".bottle").forEach(g=>{
    const i=+g.dataset.i, hit=g.querySelector(".bottleHit");
    hit.addEventListener("click",()=>toggle(i));
    hit.addEventListener("keydown",e=>{ if(e.key===" "||e.key==="Enter"){e.preventDefault();toggle(i);} });
  });
}

function toggle(i){
  if(state.mixed) return;
  const at=state.picks.indexOf(i);
  if(at>-1){ state.picks.splice(at,1); sfxDrop(); emit("flavour_deselected",{index:i,name:FLAVOURS[i].name}); }
  else{
    if(state.picks.length>=2) return;      // two only, per the brief
    state.picks.push(i); sfxPick(i); emit("flavour_selected",{index:i,name:FLAVOURS[i].name});
  }
  render();
  if(state.picks.length===2) emit("mix_created",{
    guess:state.picks.map(k=>FLAVOURS[k].name),
    guessIndexes:[...state.picks],
    mixColour:mixFlavours(state.picks[0],state.picks[1])
  });
}

/* ------------------------------ scene ---------------------------------- */
function buildScene(){
  $("#svg-scene").innerHTML = `<defs>
    <clipPath id="potClip">
      <rect x="408" y="660" width="368" height="146"/>
      <ellipse cx="592" cy="806" rx="184" ry="28"/>
    </clipPath>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g id="liquid" clip-path="url(#potClip)" opacity="0">
    <ellipse id="surface"  cx="592" cy="806" rx="184" ry="30"/>
    <ellipse id="surfHi"   cx="592" cy="800" rx="150" ry="19" fill="#fff" opacity=".16"/>
    <ellipse id="surfEdge" cx="592" cy="806" rx="184" ry="30" fill="none" stroke-width="5" opacity=".55"/>
    <g id="bubbles"></g>
  </g>
  <g id="labels"></g>
  <g id="mixBtn" style="cursor:pointer" role="button" tabindex="0" aria-label="Mix the mystery">
    <ellipse cx="597" cy="1082" rx="152" ry="63" fill="transparent"/>
    <ellipse id="btnGlow" cx="597" cy="1082" rx="150" ry="61" fill="none"
             stroke="#ffd76a" stroke-width="7" opacity="0" filter="url(#softGlow)"/>
  </g>`;
  const b=$("#mixBtn");
  b.addEventListener("click",submitMix);
  b.addEventListener("keydown",e=>{ if(e.key===" "||e.key==="Enter"){e.preventDefault();submitMix();} });
}

const SLOTS=[{cx:249},{cx:749}];
const SLOT_W=262;                     // the purple underline is 278 units wide
function labelInk(hex){
  // keep dark flavours (Blue Raspberry, Grape) readable on the white bubble
  const [h,s,l]=rgb2hsl(hex);
  const fill=hsl2hex(h,Math.min(1,s*1.1),Math.min(.55,Math.max(.42,l)));
  return [fill, hsl2hex(h,Math.min(1,s*1.15),Math.max(.20,Math.min(.30,l*.55)))];
}
function drawLabels(){
  $("#labels").innerHTML = SLOTS.map((s,n)=>{
    const i=state.picks[n]; if(i==null) return "";
    const f=FLAVOURS[i], words=f.name.toUpperCase().split(" ");
    const lines = words.length>1 && f.name.length>9
      ? [words[0], words.slice(1).join(" ")] : [f.name.toUpperCase()];
    const size = lines.length>1 ? 72 : 80;
    const y0   = lines.length>1 ? 200 : 258;
    const [fill,ink]=labelInk(f.color);
    return `<text class="flavLabel" x="${s.cx}" y="${y0}" text-anchor="middle"
      font-family="var(--display)" font-weight="900" font-size="${size}" letter-spacing="1"
      fill="${fill}" stroke="${ink}" stroke-width="7" paint-order="stroke">
      ${lines.map((t,k)=>`<tspan x="${s.cx}" dy="${k?68:0}">${t}</tspan>`).join("")}
    </text>`;
  }).join("");
  fitLabels();
}
/* The comp was set in a display face we don't have. Whatever font actually
   resolves, shrink each label until it sits inside its underline so long
   names can't run into the "+" in the middle of the thought bubble. */
function fitLabels(){
  for(let pass=0;pass<2;pass++)          // letter-spacing is fixed, so converge
  document.querySelectorAll("#labels .flavLabel").forEach(t=>{
    const base=parseFloat(t.getAttribute("font-size"));
    let widest=0;
    t.querySelectorAll("tspan").forEach(sp=>{
      try{ widest=Math.max(widest, sp.getComputedTextLength()); }catch(e){}
    });
    if(widest>SLOT_W && widest>0){
      const size=Math.max(34, base*SLOT_W/widest);
      t.setAttribute("font-size",size);
      t.setAttribute("stroke-width",(7*size/base).toFixed(1));
      t.querySelectorAll("tspan").forEach((sp,k)=>{ if(k) sp.setAttribute("dy",(68*size/base).toFixed(1)); });
    }
  });
}

let bubbleTimer=null;
function drawLiquid(){
  const g=$("#liquid"), surf=$("#surface"), bub=$("#bubbles");
  if(!state.picks.length){ g.setAttribute("opacity","0"); clearInterval(bubbleTimer); bub.innerHTML=""; return; }
  const col = state.picks.length===2
    ? mixFlavours(state.picks[0],state.picks[1])
    : FLAVOURS[state.picks[0]].color;
  g.setAttribute("opacity","1");
  surf.setAttribute("fill",col);
  $("#surfEdge").setAttribute("stroke",shade(col,.62));
  // only the finished mix glows — a single flavour is just liquid sitting in the pot
  surf.setAttribute("filter", state.picks.length===2 ? "url(#softGlow)" : "none");

  clearInterval(bubbleTimer); bub.innerHTML="";
  if(state.picks.length===2){
    const spawn=()=>{
      const r=8+Math.random()*20, x=452+Math.random()*280;
      const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
      c.setAttribute("cx",x); c.setAttribute("r",r);
      c.setAttribute("fill",shade(col,1.22)); c.setAttribute("opacity",".9");
      c.innerHTML=`<animate attributeName="cy" from="812" to="${778-Math.random()*22}" dur="1.4s" fill="freeze"/>
                   <animate attributeName="r" from="${r*.4}" to="${r}" dur="1.4s" fill="freeze"/>
                   <animate attributeName="opacity" from=".9" to="0" dur="1.4s" fill="freeze"/>`;
      bub.appendChild(c);
      setTimeout(()=>c.remove(),1500);
    };
    for(let k=0;k<5;k++) setTimeout(spawn,k*90);
    bubbleTimer=setInterval(spawn,230);
  }
}

function render(){
  document.querySelectorAll("#svg-shelf .bottle").forEach(g=>{
    const i=+g.dataset.i, on=state.picks.includes(i);
    g.querySelector(".lift").setAttribute("transform",`scale(${on?1.13:1})`);
    g.querySelector(".lift").style.transition="transform .28s cubic-bezier(.34,1.6,.5,1)";
    g.querySelector(".halo").setAttribute("opacity",on?".55":"0");
    g.querySelector(".sprite").setAttribute("opacity",on?"1":"0");
    const ring=g.querySelector(".ring");
    ring.setAttribute("opacity",on?"1":"0"); ring.setAttribute("stroke-width",on?"10":"0");
    g.querySelector(".bottleHit").setAttribute("aria-pressed",String(on));
    g.style.opacity = (state.picks.length===2 && !on) ? ".55" : "1";
  });
  drawLabels(); drawLiquid();
  const ready = state.picks.length===2;
  $("#btnGlow").setAttribute("opacity", ready ? "1" : "0");
  $("#btnGlow").style.animation = ready ? "pulse 1.6s ease-out infinite" : "none";
  $("#mixBtn").style.cursor = ready ? "pointer" : "default";
}

/* ------------------------------ form ----------------------------------- */
function buildForm(){
  $("#formPanel").innerHTML = `
    <h2 class="formTitle">LAST STEP:</h2>
    <p class="formSub">Fill out your info for a chance to win!</p>
    <form id="entryForm" novalidate>
      <div class="fields">
        <div><input id="f-name"  name="name"  placeholder="Name" autocomplete="name" required></div>
        <div><input id="f-email" name="email" placeholder="Email address" type="email"
                    autocomplete="email" inputmode="email" required></div>
        <div>
          <select id="f-fav" name="favourite" required>
            <option value="">FAVOURITE FLAVOUR</option>
            ${FLAVOURS.map((f,i)=>`<option value="${f.name}">${f.name}</option>`).join("")}
          </select>
        </div>
      </div>
      <label class="consent">
        <input type="checkbox" id="f-optin" name="optin">
        <span>Yes, sign me up for the HI-CHEW newsletter. (Optional &mdash; you can still enter without it.)</span>
      </label>
      <label class="consent">
        <input type="checkbox" id="f-age" name="age" required>
        <span>I'm 18 or older and I accept the <a href="#" onclick="return false">Official Rules</a>. <em>Required.</em></span>
      </label>
      <p class="err" id="formErr" role="alert"></p>
      <button class="btnPill" type="submit">SUBMIT</button>
      <button class="btnPill btnGhost" type="button" id="btn-back">BACK TO MY MIX</button>
    </form>`;
  $("#entryForm").addEventListener("submit",onSubmit);
  $("#btn-back").addEventListener("click",()=>{ $("#formPanel").classList.remove("open"); });
}

function onSubmit(e){
  e.preventDefault();
  const name=$("#f-name").value.trim(), email=$("#f-email").value.trim(),
        fav=$("#f-fav").value, age=$("#f-age").checked;
  const err=$("#formErr");
  if(!name)                       return err.textContent="Chewbie needs a name!";
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email))
                                  return err.textContent="That email doesn't look right.";
  if(!fav)                        return err.textContent="Pick your favourite flavour.";
  if(!age)                        return err.textContent="Please confirm your age and accept the rules.";
  err.textContent="";
  const entry = {
    name, email, favourite:fav,
    optIn:$("#f-optin").checked,
    guess:[FLAVOURS[state.picks[0]].name, FLAVOURS[state.picks[1]].name],
    guessIndexes:[state.picks[0], state.picks[1]],
    mixColour:mixFlavours(state.picks[0],state.picks[1]),
    ts:new Date().toISOString()
  };
  if(CFG.recaptcha){ setPending(true); requestToken(t=>finishSubmit(entry,t)); }
  else finishSubmit(entry, null);
}

/* Matches the handshake Multiply already use in their theme sections: the
   frame posts the bare string "request-recaptcha", the host runs grecaptcha
   and posts back { type:"recaptcha-token", token }. */
let tokenCb=null, tokenTimer=null;
function requestToken(cb){
  tokenCb=cb;
  clearTimeout(tokenTimer);
  tokenTimer=setTimeout(()=>{ const f=tokenCb; tokenCb=null; if(f) f(null); }, CFG.recaptchaMs);
  try{ if(window.parent!==window) window.parent.postMessage("request-recaptcha", CFG.targetOrigin); }
  catch(e){ clearTimeout(tokenTimer); tokenCb=null; cb(null); }
}
function finishSubmit(entry, token){
  if(token) entry.recaptchaToken = token;
  emit("entry_submitted", { entry });
  if(CFG.waitForHost) setPending(true);   // host must ack before we advance
  else { setPending(false); showDone(); }
}

function setPending(on){
  const b=document.querySelector("#entryForm .btnPill");
  b.disabled=on; b.textContent = on ? "SENDING…" : "SUBMIT";
  b.style.opacity = on ? ".6" : "1";
}

/* The host answers entry_submitted only when CFG.waitForHost is true. */
addEventListener("message", e=>{
  const m=e.data;
  if(m && m.type==="recaptcha-token" && tokenCb){
    clearTimeout(tokenTimer);
    const f=tokenCb; tokenCb=null; f(m.token||null); return;
  }
  if(!m || m.source!=="mystery-mix-host") return;
  if(m.type==="entry_accepted"){ setPending(false); showDone(); }
  if(m.type==="entry_rejected"){
    setPending(false);
    $("#formErr").textContent = m.message || "Chewbie couldn't save that. Try again.";
  }
});

/* ------------------------------ flow ----------------------------------- */
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on", s.id===id));
  emit("screen", { screen:id.replace("s-","") });
}
function submitMix(){
  if(state.picks.length!==2) return;
  if(!state.mixed){ state.mixed=true; sfxBubble(); }
  $("#formPanel").classList.add("open");
}
function showDone(){
  sfxWin();
  $("#doneChips").innerHTML =
    `<img src="${ASSETS['d'+String(state.picks[0]).padStart(2,'0')]}" alt="">
     <span>+</span>
     <img src="${ASSETS['d'+String(state.picks[1]).padStart(2,'0')]}" alt="">`;
  show("s-done");
}
function reset(){
  state.picks=[]; state.mixed=false;
  $("#formPanel").classList.remove("open");
  $("#entryForm").reset(); $("#formErr").textContent=""; setPending(false);
  render(); show("s-game"); emit("restart");
}

/* place the invisible hotspots over the baked buttons in each plate.
   Percentages are measured off the comps, so they track the letterboxed
   background-size:contain box at any viewport size. */
const HOTSPOTS = {
  "btn-play"  : { d:[.6667,.7764,.2396,.1500], m:[.2870,.7500,.4259,.1115] },
  "btn-start" : { d:[.4094,.8333,.1812,.1125], m:[.3389,.8344,.3222,.0854] }
};
function placeHotspots(){
  const portrait = window.matchMedia("(max-aspect-ratio:1/1)").matches;
  const ar = portrait ? 1080/1920 : 4/3;
  const vw=innerWidth, vh=innerHeight;
  let w=vw, h=vw/ar; if(h>vh){ h=vh; w=vh*ar; }
  const ox=(vw-w)/2, oy=(vh-h)/2;
  for(const [id,cfg] of Object.entries(HOTSPOTS)){
    const [l,t,bw,bh]=portrait?cfg.m:cfg.d, el=document.getElementById(id);
    el.style.left=(ox+l*w)+"px"; el.style.top=(oy+t*h)+"px";
    el.style.width=(bw*w)+"px";  el.style.height=(bh*h)+"px";
  }
}

function init(){
  document.body.style.background = CFG.pageColor;
  const R=document.documentElement.style;
  R.setProperty("--title-d",`url(${ASSETS.title_d})`); R.setProperty("--title-m",`url(${ASSETS.title_m})`);
  R.setProperty("--rules-d",`url(${ASSETS.rules_d})`); R.setProperty("--rules-m",`url(${ASSETS.rules_m})`);
  R.setProperty("--done-d", `url(${ASSETS.done_d})`);  R.setProperty("--done-m", `url(${ASSETS.done_m})`);
  $("#img-scene").src=ASSETS.scene; $("#img-shelf").src=ASSETS.shelf;

  buildShelf(); buildScene(); buildForm(); render(); placeHotspots();

  $("#btn-play").addEventListener("click",()=>{ ac().resume(); tone(660,.2,"triangle"); show("s-rules"); });
  $("#btn-start").addEventListener("click",()=>{ tone(880,.2,"triangle"); show("s-game"); });
  $("#btn-again").addEventListener("click",reset);
  $("#mute").addEventListener("click",e=>{
    muted=!muted; e.currentTarget.textContent = muted ? "✕" : "♫";
    e.currentTarget.setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound");
  });
  addEventListener("resize",()=>{ placeHotspots(); emitSize(); });
  addEventListener("orientationchange",()=>setTimeout(()=>{ placeHotspots(); emitSize(); },120));
  emit("ready",{ flavours:FLAVOURS.map(f=>f.name) });
  emitSize();
}
init();
</script>
